- name: Install sudo
  tags: bootstrap, apt, sudo
  apt:
    update-cache: true
    state: present
    name: sudo

- name: Create ansible-bot user
  tags: bootstrap,ssh,users
  user:
    name: ansible-bot
    groups: root, sudo 

- name: Add ssh key for ansible-bot user
  tags: bootstrap,ssh
  authorized_key:
    user: ansible-bot
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIxStHYnfTpoIC+j88LgiQHstIPkppza2FkLBLoETyd8 ansible-main-key"

- name: Add sudoers file for ansible-bot
  tags: bootstrap,sudoers,copy
  copy:
    src: sudoer_ansible-bot
    dest: /etc/sudoers.d/ansible-bot 
    owner: root
    group: root
    mode: 0440
